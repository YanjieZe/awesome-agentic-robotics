name: Refresh paper figures

on:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/insights.py
      - .github/workflows/paper-figures.yml

permissions:
  contents: write

concurrency:
  group: paper-figures-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate and publish changed figures
        run: |
          python3 scripts/insights.py
          git add assets/monthly.svg assets/title-terms.svg assets/method-share.svg assets/task-share.svg
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Refresh paper figures"
            git push origin HEAD:main
          fi
